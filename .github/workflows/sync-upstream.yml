name: Sync upstream

# 每天自动把上游 MarSeventh/CloudFlare-ImgBed 的改动合并到本仓库
# 也可以在 Actions 页面点 "Run workflow" 手动触发

on:
  schedule:
    # UTC 20:00 == 北京时间次日 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MarSeventh/CloudFlare-ImgBed.git
          git fetch upstream main --tags

          if git merge --no-edit upstream/main; then
            if git diff --quiet origin/main HEAD; then
              echo "上游没有新改动，无需同步。"
            else
              git push origin HEAD:main
            fi
          else
            git merge --abort || true
            echo "::error::与上游存在冲突，已放弃本次合并，请手动处理。"
            exit 1
          fi
